<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="100" y1="50" x2="500" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="280" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="goldMedal" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="cardShadow" x="-20" y="-10" width="340" height="260" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="floatShadow" x="-10" y="-10" width="220" height="120" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Ambient Graphic -->
  <rect x="30" y="20" width="540" height="420" rx="32" fill="url(#bgGlow)" opacity="0.7"/>
  <circle cx="500" cy="90" r="70" fill="#BFDBFE" opacity="0.4"/>
  <circle cx="90" cy="360" r="90" fill="#C7D2FE" opacity="0.3"/>
  <path d="M120 70C200 40 380 90 480 60" stroke="#93C5FD" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Main Central Card: Verified Scholarship Match -->
  <g filter="url(#cardShadow)" transform="translate(140, 70)">
    <rect width="320" height="240" rx="20" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Card Header -->
    <rect x="20" y="22" width="46" height="46" rx="12" fill="url(#blueAccent)"/>
    <!-- Mortarboard Icon -->
    <path d="M43 36L28 44L43 51L58 44L43 36Z" fill="#FFFFFF"/>
    <path d="M33 48V53C33 55.5 37.5 57.5 43 57.5C48.5 57.5 53 55.5 53 53V48L43 52.5L33 48Z" fill="#E2E8F0"/>
    <path d="M57 45V53C57 54 56 55 55.5 55" stroke="#FBBF24" stroke-width="2"/>
    <circle cx="55.5" cy="55.5" r="2" fill="#F59E0B"/>

    <!-- Header Text -->
    <text x="78" y="42" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#0F172A">National Merit Scheme</text>
    <text x="78" y="58" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#64748B">Ministry of Higher Education</text>

    <!-- Score Bar Component -->
    <rect x="20" y="88" width="280" height="42" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <circle cx="42" cy="109" r="12" fill="#10B981"/>
    <path d="M37 109L40 112L47 105" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="113" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#065F46">98% Eligibility Match</text>
    <rect x="236" y="99" width="54" height="20" rx="10" fill="#10B981"/>
    <text x="246" y="113" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">ELIGIBLE</text>

    <!-- Criteria Breakdown Checklist -->
    <g transform="translate(24, 146)">
      <!-- Item 1 -->
      <circle cx="6" cy="6" r="6" fill="#10B981" opacity="0.2"/>
      <path d="M3 6L5 8L9 4" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
      <text x="20" y="9" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#334155">Income Criteria: Passed (&lt; ₹4.5L)</text>
      
      <!-- Item 2 -->
      <circle cx="6" cy="28" r="6" fill="#10B981" opacity="0.2"/>
      <path d="M3 28L5 30L9 26" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
      <text x="20" y="31" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#334155">Academic Marks: 84% (&gt;= 75% required)</text>

      <!-- Item 3 -->
      <circle cx="6" cy="50" r="6" fill="#10B981" opacity="0.2"/>
      <path d="M3 50L5 52L9 48" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
      <text x="20" y="53" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#334155">Course: B.Tech / Undergraduate Level</text>
    </g>

    <!-- Grant Pill -->
    <rect x="20" y="215" width="280" height="1" fill="#E2E8F0"/>
  </g>

  <!-- Floating Badge Left: Grant Amount -->
  <g filter="url(#floatShadow)" transform="translate(48, 260)">
    <rect width="180" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="14" y="17" width="40" height="40" rx="10" fill="#EFF6FF"/>
    <text x="26" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#2563EB">₹</text>
    <text x="64" y="34" font-family="system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#64748B">ANNUAL BENEFIT</text>
    <text x="64" y="52" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#0F172A">₹50,000 / yr</text>
  </g>

  <!-- Floating Badge Right: Government Verified -->
  <g filter="url(#floatShadow)" transform="translate(370, 290)">
    <rect width="190" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="14" y="17" width="40" height="40" rx="10" fill="#FEF3C7"/>
    <!-- Shield / Seal -->
    <path d="M34 25L24 29V35C24 41 28.5 46 34 48C39.5 46 44 41 44 35V29L34 25Z" fill="url(#goldMedal)"/>
    <path d="M30 36L33 39L38 33" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="64" y="34" font-family="system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#64748B">AUTHENTICITY</text>
    <text x="64" y="52" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#0F172A">Govt Scheme Match</text>
  </g>

  <!-- Floating Step Badge Top Right -->
  <g transform="translate(420, 50)">
    <rect width="130" height="36" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5" filter="url(#floatShadow)"/>
    <circle cx="18" cy="18" r="8" fill="#2563EB"/>
    <text x="15" y="22" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF">1</text>
    <text x="34" y="22" font-family="system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#1E40AF">Instant Match</text>
  </g>
</svg>
